title: Peregrine
description: An all-in-one FTC library for action scheduling, pathing, localization, and more.

# Built by GitHub Pages from the /docs folder. just-the-docs gives a sidebar, search and callouts.
remote_theme: just-the-docs/just-the-docs@v0.10.2
plugins:
  - jekyll-remote-theme

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  "Peregrine on GitHub": "https://github.com/Noah-MG/Peregrine"
aux_links_new_tab: true

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
